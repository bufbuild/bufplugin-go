version: "2"
linters:
  default: all
  disable:
    - cyclop            # covered by gocyclo
    - depguard          # unnecessary for small libraries
    - err113            # way too noisy
    - exhaustruct       # many exceptions
    - exhaustruct_v5    # many exceptions
    - funlen            # rely on code review to limit function length
    - gochecknoglobals  # many exceptions
    - gocognit          # dubious "cognitive overhead" quantification
    - goconst           # many exceptions
    - gomodguard        # replaced by gomodguard_v2
    - inamedparam       # not standard style
    - interfacebloat    # many exceptions
    - ireturn           # "accept interfaces, return structs" isn't ironclad
    - lll               # don't want hard limits for line length
    - maintidx          # covered by gocyclo
    - nilnil            # allow this
    - nlreturn          # generous whitespace violates house style
    - noinlineerr       # excess scope violates house style
    - testifylint       # does not want us to use assert
    - testpackage       # internal tests are fine
    - thelper           # we want to print out the whole stack
    - wrapcheck         # don't _always_ need to wrap errors
    - wsl               # generous whitespace violates house style
    - wsl_v5            # generous whitespace violates house style
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
        - pattern: ^log\.
        - pattern: ^print$
        - pattern: ^println$
        - pattern: ^panic$
    godox:
      # TODO, OPT, etc. comments are fine to commit. Use FIXME comments for
      # temporary hacks, and use godox to prevent committing them.
      keywords:
        - FIXME
    varnamelen:
      ignore-decls:
        - T any
        - i int
        - wg sync.WaitGroup
        - id string
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: check/client.go
        text: CheckCallOption
      - linters:
          - revive
        path: check/check_service_handler.go
        text: stutter
      - linters:
          - exhaustive
        path: option/options.go
        text: reflect.Pointer|reflect.Ptr
      - linters:
          - gocritic
        path: check/file.go
        text: commentFormatting
      - linters:
          - gocritic
        path: check/location.go
        text: commentFormatting
      - linters:
          - unparam
        path: check/category_spec.go
      - linters:
          - unparam
        path: check/annotation.go
      - linters:
          - unparam
        path: check/response.go
      - linters:
          - unparam
        path: info/plugin_info.go
      - linters:
          - varnamelen
        path: check/internal/example
      - linters:
          - dupl
        path: check/checkutil/breaking.go
      - linters:
          - varnamelen
        path: check/checkutil/breaking.go
      - linters:
          - varnamelen
        path: check/checkutil/lint.go
      - linters:
          - varnamelen
        path: check/checkutil/util.go
      - linters:
          - varnamelen
        path: internal/pkg/xslices/xslices.go
      - linters:
          - revive
        path: internal/pkg/compare/compare.go
      - linters:
          - gosec
        path: check/checktest/checktest.go
        text: 'G115:'
formatters:
  enable:
    - gci
  exclusions:
    generated: lax
