syntax = "proto3";

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  A a = 5000;
}

message A {
  string b = 1;
  C c = 2;
}

message C {
  string d = 3;
}

message Foo {
  option deprecated = true;
  option (a).b = "x";
  option (a).c.d = "y";
}

message Bar {
  option deprecated = true;
  option (a).c = {
    d: "y",
  };
  option (a).b = "x";
}
